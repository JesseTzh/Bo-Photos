services:
  bophotos:
    image: jessetzh/bo-photos:latest
    ports:
      - "8080:8080"
    environment:
      BOPHOTOS_COOKIE_SECURE: "false"
      BOPHOTOS_INITIAL_PASSWORD: ${BOPHOTOS_INITIAL_PASSWORD:?set BOPHOTOS_INITIAL_PASSWORD in your environment or .env}
    volumes:
      - ./data:/data
    restart: unless-stopped
