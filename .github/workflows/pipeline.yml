name: Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: jessetzh/bo-photos

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: make check

  fresh-start:
    name: Start from an empty data volume
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: docker build --build-arg BOPHOTOS_GIT_SHA="${GITHUB_SHA}" --tag bophotos-ci:local .

      - name: Decode test.ARW inside production image
        run: |
          set -euo pipefail
          test -f test.ARW
          docker run --rm \
            --volume "$PWD/test.ARW:/fixture/test.ARW:ro" \
            --entrypoint bash \
            bophotos-ci:local \
            -lc '
              set -euo pipefail
              filetype=$(exiftool -s3 -FileType /fixture/test.ARW)
              test "$filetype" = "ARW"
              model=$(exiftool -s3 -Model /fixture/test.ARW)
              test "$model" = "ILCE-6400"
              command -v simple_dcraw >/dev/null || command -v dcraw_emu >/dev/null
              cp /fixture/test.ARW /tmp/test.ARW
              if command -v simple_dcraw >/dev/null; then
                simple_dcraw -T /tmp/test.ARW
              else
                dcraw_emu -T /tmp/test.ARW
              fi
              decoded=$(ls /tmp/test.ARW.tiff /tmp/test.ARW.tif /tmp/test.tiff /tmp/test.ARW.ppm 2>/dev/null | head -n 1)
              test -n "$decoded"
              test -s "$decoded"
              header=$(vipsheader "$decoded")
              echo "$header"
              width=$(echo "$header" | sed -n "s/^\([^:]*\): \([0-9]*\)x.*/\2/p")
              test "$width" -ge 6000
              vipsthumbnail "$decoded" \
                --size 480x480\> \
                --rotate \
                --export-profile srgb \
                --output /tmp/raw-ci.webp[Q=80,strip]
              test -s /tmp/raw-ci.webp
              hexdump -C -n 12 /tmp/raw-ci.webp | grep -q "RIFF"
              hexdump -C -s 8 -n 4 /tmp/raw-ci.webp | grep -q "WEBP"
            '

      - name: Verify startup and restart
        run: |
          set -euo pipefail

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs bophotos-ci 2>/dev/null || true
            fi
            docker rm --force bophotos-ci 2>/dev/null || true
            docker volume rm bophotos-ci-data 2>/dev/null || true
            exit "$status"
          }

          wait_ready() {
            attempts="$1"
            for attempt in $(seq 1 "$attempts"); do
              if curl --fail --silent http://127.0.0.1:18080/health/ready; then
                return 0
              fi
              docker inspect --format '{{.State.Running}}' bophotos-ci | grep --quiet true
              sleep 1
            done
            return 1
          }

          trap cleanup EXIT
          docker volume create bophotos-ci-data
          docker run --detach --name bophotos-ci \
            --publish 127.0.0.1:18080:8080 \
            --env BOPHOTOS_INITIAL_PASSWORD=ci-initial-password \
            --volume bophotos-ci-data:/data \
            bophotos-ci:local
          wait_ready 60

          docker rm --force bophotos-ci
          docker run --detach --name bophotos-ci \
            --publish 127.0.0.1:18080:8080 \
            --volume bophotos-ci-data:/data \
            bophotos-ci:local
          wait_ready 30

  build-and-push:
    name: Build and push Docker image
    if: github.event_name != 'pull_request'
    needs:
      - check
      - fresh-start
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BOPHOTOS_GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    if: github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Run remote deploy script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?missing SSH_HOST secret}"
          : "${SSH_USER:?missing SSH_USER secret}"
          : "${SSH_PRIVATE_KEY:?missing SSH_PRIVATE_KEY secret}"

          SSH_PORT="${SSH_PORT:-22}"
          SSH_DEPLOY_SCRIPT="/root/bo-photos/deploy.sh"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          fi

          ssh \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "bash '$SSH_DEPLOY_SCRIPT'"
